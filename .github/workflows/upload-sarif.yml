name: CI/CD Evaluation Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-evaluation:
    runs-on: ubuntu-latest
    steps:
      - name: Gửi yêu cầu Evaluation
        run: |
          # 1. Đường link Ngrok trỏ về server eval của bạn
          EVAL_SERVER="https://8106-103-9-211-2.ngrok-free.app"
          
          # 2. URL của Agent bạn đang dev/staging (để server eval biết mà gọi đến test)
          # Lưu ý: Sửa lại địa chỉ thực tế của Agent staging của bạn ở đây
          TARGET_AGENT_URL="http://<ip-agent-cua-ban>:5009"
          
          echo "🚀 Đang kích hoạt LLMOps Eval..."
          
          # Gọi API tạo lượt chạy
          RESPONSE=$(curl -s -X POST "$EVAL_SERVER/api/eval-runs" \
            -H "Content-Type: application/json" \
            -d "{\"target_url\": \"$TARGET_AGENT_URL\", \"agent_config_name\": \"agent_config\"}")

          echo "===== RESPONSE ====="
          echo "$RESPONSE"
          echo "===================="
          
          RUN_ID=$(echo "$RESPONSE" | jq -r '.eval_run_id')
          
          if [ "$RUN_ID" = "null" ] || [ -z "$RUN_ID" ]; then
            echo "❌ Lỗi kích hoạt. Server trả về: $RESPONSE"
            exit 1
          fi
          
          echo "✅ Đã tạo Run ID: $RUN_ID"
          echo "⏳ Chờ kết quả đánh giá (Polling)..."

          # Vòng lặp chờ kết quả (15 giây check 1 lần)
          while true; do
            STATUS_RESP=$(curl -s "$EVAL_SERVER/api/eval-runs/$RUN_ID")
            STATUS=$(echo "$STATUS_RESP" | jq -r '.status')
            
            if [ "$STATUS" = "success" ]; then
              GATE_STATUS=$(echo "$STATUS_RESP" | jq -r '.result.gate.gate_status')
              OVERALL_SCORE=$(echo "$STATUS_RESP" | jq -r '.result.summary.overall_score')
              
              echo "📊 Điểm số hệ thống: $OVERALL_SCORE"
              echo "🚦 CI/CD Gate: $GATE_STATUS"
              
              if [ "$GATE_STATUS" = "PASS" ]; then
                echo "🟢 ĐẠT CHUẨN! Cho phép Deploy."
                exit 0
              else
                echo "❌ TRƯỢT GATE! Chặn Deploy."
                exit 1
              fi
            elif [ "$STATUS" = "failed" ]; then
              echo "❌ Hệ thống eval báo lỗi hệ thống!"
              exit 1
            fi
            
            sleep 15
          done
