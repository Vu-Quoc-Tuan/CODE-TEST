name: Upload SARIF to Code Scanning

on:
  push:
    paths:
      - '**.sarif'

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: combined.sarif